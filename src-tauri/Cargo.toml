[package]
name = "myvault"
version.workspace = true
edition.workspace = true
description = "MyVault - offline encrypted file vault for Windows"

[lib]
name = "myvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the built frontend instead of using the dev server. The Tauri CLI
# enables this automatically for `tauri build`; enable it manually when
# building with plain cargo.
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "myvault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
myvault-core = { path = "../core" }
zeroize = "1.8"
